  products-db:
    image: public.ecr.aws/docker/library/postgres:17-alpine
    ports:
      - "5433:5432"
    environment:
      POSTGRES_DB: products
      POSTGRES_USER: products
      POSTGRES_PASSWORD: products
    volumes:
      - products-data-v2:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U products -d products" ]
      interval: 5s
      timeout: 3s
      retries: 20
    networks:
      default:
        aliases:
          - products-db

volumes:
  products-data-v2:

