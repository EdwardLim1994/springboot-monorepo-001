databaseChangeLog:
  - changeSet:
      id: 1-create-products
      author: learning
      changes:
        - createTable:
            tableName: product
            columns:
              - column:
                  name: id
                  type: varchar(255)
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: name
                  type: varchar(255)
                  constraints:
                    nullable: false
              - column:
                  name: price
                  type: float8
                  constraints:
                    nullable: false
