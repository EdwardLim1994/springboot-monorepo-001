spring:
  application:
    name: products
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5433/products}
    username: ${SPRING_DATASOURCE_USERNAME:products}
    password: ${SPRING_DATASOURCE_PASSWORD:products}
  graphql:
    graphiql:
      enabled: true
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
server:
  port: 8081
