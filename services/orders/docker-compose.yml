  orders-db:
    image: public.ecr.aws/docker/library/postgres:17-alpine
    ports:
      - "5434:5432"
    environment:
      POSTGRES_DB: orders
      POSTGRES_USER: orders
      POSTGRES_PASSWORD: orders
    volumes:
      - orders-data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U orders -d orders" ]
      interval: 5s
      timeout: 3s
      retries: 20
    networks:
      default:
        aliases:
          - orders-db

volumes:
  orders-data:

