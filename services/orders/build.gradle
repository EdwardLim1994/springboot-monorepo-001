dependencies {
    implementation project(':common:federation')
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-graphql'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.liquibase:liquibase-core'
    runtimeOnly 'info.picocli:picocli:4.7.7'
    implementation 'org.springframework.boot:spring-boot-starter-kafka'
    runtimeOnly 'org.postgresql:postgresql'
}

tasks.register('migrate', JavaExec) {
    group = 'database'
    description = 'Applies the orders database Liquibase changelog.'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'liquibase.integration.commandline.LiquibaseCommandLine'
    args '--changeLogFile=src/main/resources/db/changelog/db.changelog-master.yaml',
        "--url=${System.getenv('SPRING_DATASOURCE_URL') ?: 'jdbc:postgresql://localhost:5434/orders'}",
        "--username=${System.getenv('SPRING_DATASOURCE_USERNAME') ?: 'orders'}",
        "--password=${System.getenv('SPRING_DATASOURCE_PASSWORD') ?: 'orders'}",
        '--driver=org.postgresql.Driver', 'update'
}
